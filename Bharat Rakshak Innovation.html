<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🇮🇳 Bharat Rakshak — भारत रक्षक</title>
<style>
/* ===== RESET & ROOT ===== */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --saffron:#FF6700; --saffronD:#CC5200; --saffronL:#FF8C42;
  --green:#138808;   --greenD:#0A5C04;   --greenL:#1DB010;
  --white:#FFFFFF;   --ashoka:#000080;
  --bg:#0A0A0F;      --bg2:#12141A;      --bg3:#1E2130;
  --bg4:#252836;     --bg5:#2C2F3E;
  --text:#EAEAEA;    --text2:#9AA0B4;    --muted:#5C6278;
  --danger:#FF3B30;  --warn:#FFD60A;     --success:#30D158;
  --border:#2C2F3E;  --borderL:#3A3D4E;
  --card-shadow:0 4px 24px rgba(0,0,0,0.4);
  --glow-saffron:0 0 20px rgba(255,103,0,0.2);
  --glow-green:0 0 20px rgba(19,136,8,0.15);
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:var(--bg2);}
::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--saffron);}

/* ===== LAYOUT ===== */
.site-wrapper{display:flex;flex-direction:column;min-height:100vh;}
.main-layout{display:flex;flex:1;}
.sidebar{width:240px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;z-index:100;display:flex;flex-direction:column;transition:transform .3s;}
.content-area{margin-left:240px;flex:1;min-height:100vh;}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);}
  .sidebar.open{transform:translateX(0);}
  .content-area{margin-left:0;}
  .mobile-menu-btn{display:flex!important;}
}

/* ===== TRICOLOR ===== */
.tribar{display:flex;height:4px;}
.tribar .s{flex:1;}
.tribar .s1{background:var(--saffron);}
.tribar .s2{background:var(--white);}
.tribar .s3{background:var(--green);}
.tribar-thin{height:2px;}
.tribar-thick{height:6px;}

/* ===== SIDEBAR ===== */
.sidebar-brand{padding:20px 16px 16px;border-bottom:1px solid var(--border);}
.sidebar-brand .flag{font-size:32px;animation:sway 4s ease-in-out infinite;}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.brand-name{font-size:15px;font-weight:900;color:var(--saffron);letter-spacing:2px;margin-top:6px;}
.brand-hindi{font-size:12px;color:var(--text2);}
.brand-badge{display:inline-flex;align-items:center;gap:4px;background:#1a0505;border:1px solid #ff3b3033;border-radius:20px;padding:3px 8px;font-size:9px;font-weight:700;color:var(--danger);letter-spacing:.5px;margin-top:6px;}

.sidebar-nav{padding:12px 8px;flex:1;overflow-y:auto;}
.nav-section-label{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:2px;text-transform:uppercase;padding:10px 12px 6px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;cursor:pointer;margin-bottom:2px;transition:all .2s;border:1px solid transparent;text-decoration:none;color:var(--text2);font-size:14px;font-weight:500;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:linear-gradient(135deg,#1a0800,#0a0f00);color:var(--saffron);border-color:var(--saffron)33;font-weight:700;}
.nav-item .nav-icon{font-size:18px;width:24px;text-align:center;}
.nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:20px;}
.nav-badge.warn{background:var(--warn);color:#000;}

.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);}
.sidebar-footer-text{font-size:10px;color:var(--muted);line-height:1.6;}

/* ===== TOP BAR ===== */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;height:60px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50;}
.mobile-menu-btn{display:none;background:none;border:none;color:var(--saffron);font-size:22px;cursor:pointer;}
.topbar-title{font-size:18px;font-weight:800;color:var(--text);flex:1;}
.topbar-sub{font-size:11px;color:var(--muted);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-lang{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--text2);font-size:12px;cursor:pointer;}
.topbar-lang select{background:transparent;border:none;color:var(--text2);font-size:12px;cursor:pointer;outline:none;}

/* ===== SCREENS ===== */
.screen{display:none;padding:24px;animation:fadeIn .3s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ===== PAGE HERO ===== */
.page-hero{border-radius:16px;padding:28px;margin-bottom:24px;position:relative;overflow:hidden;}
.page-hero-title{font-size:28px;font-weight:900;color:var(--text);margin-bottom:6px;}
.page-hero-sub{font-size:14px;color:var(--text2);line-height:1.6;}
.page-hero-icon{font-size:48px;margin-bottom:12px;}

/* ===== GRID ===== */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:1fr 1fr;}}
@media(max-width:700px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}}

/* ===== CARDS ===== */
.card{background:var(--bg3);border-radius:12px;border:1px solid var(--border);padding:18px;box-shadow:var(--card-shadow);}
.card-saffron{border-left:3px solid var(--saffron);}
.card-green{border-left:3px solid var(--green);}
.card-ashoka{border-left:3px solid var(--ashoka);}
.card-danger{border-left:3px solid var(--danger);}
.card-warn{border-left:3px solid var(--warn);}
.card-success{border-left:3px solid var(--success);}
.card:hover{border-color:var(--borderL);transform:translateY(-1px);transition:all .2s;}
.card-title{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}
.card-value{font-size:32px;font-weight:900;color:var(--text);}
.card-label{font-size:13px;color:var(--text2);margin-top:4px;}

/* ===== STAT CARDS ===== */
.stat-card{background:var(--bg3);border-radius:12px;border:1px solid var(--border);padding:18px;text-align:center;}
.stat-icon{font-size:28px;margin-bottom:8px;}
.stat-value{font-size:28px;font-weight:900;}
.stat-label{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600;}

/* ===== BADGES ===== */
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-ok{background:#0d2b0d;color:var(--success);}
.badge-low{background:#2b2200;color:var(--warn);}
.badge-critical{background:#2d0a0a;color:var(--danger);}
.badge-victory{background:#0d2b0d33;color:var(--success);border:1px solid var(--success);}
.badge-defeat{background:#2d0a0a33;color:var(--danger);border:1px solid var(--danger);}
.badge-mixed{background:#2b220033;color:var(--warn);border:1px solid var(--warn);}
.badge-decisive{background:#00aa5533;color:#00ff88;border:1px solid #00aa55;}

/* ===== PROGRESS BAR ===== */
.progress-wrap{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:8px;}
.progress-bar{height:6px;border-radius:3px;transition:width .6s ease;}

/* ===== TABS ===== */
.tabs{display:flex;gap:4px;background:var(--bg2);padding:4px;border-radius:10px;margin-bottom:20px;flex-wrap:wrap;}
.tab-btn{padding:8px 16px;border-radius:8px;border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;}
.tab-btn.active{background:var(--saffron);color:#fff;font-weight:800;}
.tab-btn:hover:not(.active){background:var(--bg3);color:var(--text);}

/* ===== BUTTONS ===== */
.btn{padding:10px 20px;border-radius:10px;border:none;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-saffron{background:linear-gradient(135deg,var(--saffron),var(--saffronD));color:#fff;}
.btn-saffron:hover{transform:translateY(-1px);box-shadow:var(--glow-saffron);}
.btn-green{background:linear-gradient(135deg,var(--green),var(--greenD));color:#fff;}
.btn-green:hover{transform:translateY(-1px);box-shadow:var(--glow-green);}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
.btn-outline:hover{border-color:var(--saffron);color:var(--saffron);}
.btn-danger{background:linear-gradient(135deg,#2d0a0a,#1a0505);border:1px solid var(--danger)33;color:var(--danger);}
.btn-sm{padding:6px 12px;font-size:12px;}

/* ===== INPUTS ===== */
input,select,textarea{background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;width:100%;transition:border-color .2s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--saffron);}
input::placeholder,textarea::placeholder{color:var(--muted);}
.form-group{margin-bottom:16px;}
.form-label{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px;display:block;}

/* ===== MODALS ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--bg3);border-radius:16px;border:1px solid var(--border);padding:28px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--muted);margin-bottom:20px;}
.modal-close{float:right;background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;line-height:1;}

/* ===== ALERT BANNER ===== */
.alert-banner{background:linear-gradient(135deg,#2d0a0a,#1a0505);border:1px solid var(--danger)44;border-radius:12px;padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.alert-banner-text{flex:1;}
.alert-banner-title{font-size:14px;font-weight:800;color:var(--danger);}
.alert-banner-sub{font-size:12px;color:var(--muted);margin-top:2px;}

/* ===== SECTION TITLE ===== */
.section-title{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

/* ===== BATTLEFIELD CANVAS ===== */
#bf-canvas{width:100%;height:280px;background:linear-gradient(180deg,#0d1a2b 65%,#2d5016 65%);border-radius:12px;border:1px solid var(--border);position:relative;overflow:hidden;}
.canvas-grid-v{position:absolute;top:0;bottom:0;border-left:1px solid #00008022;}
.canvas-grid-h{position:absolute;left:0;right:0;border-top:1px solid #00008016;}
.hud-corner{position:absolute;width:20px;height:20px;}
.hud-tl{top:8px;left:8px;border-top:2px solid var(--saffron);border-left:2px solid var(--saffron);}
.hud-tr{top:8px;right:8px;border-top:2px solid var(--saffron);border-right:2px solid var(--saffron);}
.hud-bl{bottom:8px;left:8px;border-bottom:2px solid var(--saffron);border-left:2px solid var(--saffron);}
.hud-br{bottom:8px;right:8px;border-bottom:2px solid var(--saffron);border-right:2px solid var(--saffron);}
.friendly-unit{position:absolute;bottom:28px;left:40px;text-align:center;font-size:24px;}
.friendly-label{font-size:8px;color:var(--success);font-weight:700;}
.enemy-unit{font-size:20px;cursor:default;transition:transform .3s;}
.distance-line{position:absolute;bottom:55px;left:80px;right:80px;border-top:1px dashed var(--ashoka);opacity:.5;}
.distance-label{position:absolute;bottom:42px;right:85px;font-size:10px;color:var(--warn);font-weight:700;}
.threat-label{position:absolute;top:12px;left:28px;font-size:10px;font-weight:800;}
.compass{position:absolute;top:8px;right:28px;width:30px;height:30px;background:#0a0a0faa;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--danger);border:1px solid var(--border);}

/* ===== RANGE CALC ===== */
.range-result{background:var(--bg4);border-radius:12px;padding:20px;text-align:center;border:1px solid var(--border);}
.range-result-value{font-size:48px;font-weight:900;color:var(--saffron);}

/* ===== HERO CARDS ===== */
.war-card{background:var(--bg3);border-radius:12px;border:1px solid var(--border);padding:18px;cursor:pointer;transition:all .2s;}
.war-card:hover{border-color:var(--saffron)44;transform:translateY(-2px);box-shadow:var(--card-shadow);}
.war-year{font-size:12px;font-weight:700;color:var(--saffron);}
.war-name{font-size:16px;font-weight:800;color:var(--text);margin:4px 0;}
.war-opponent{font-size:12px;color:var(--muted);}
.war-summary{font-size:13px;color:var(--text2);line-height:1.6;margin:8px 0;}
.war-footer{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}

.martyr-card{background:var(--bg3);border-radius:12px;border:1px solid var(--border);padding:18px;display:flex;gap:14px;cursor:pointer;transition:all .2s;}
.martyr-card:hover{border-color:#ff3b3033;transform:translateY(-1px);}
.martyr-flame{width:48px;height:48px;border-radius:24px;background:#1a0800;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;border:1px solid #ff3b3022;}
.martyr-name{font-size:15px;font-weight:800;color:var(--text);}
.martyr-rank{font-size:12px;color:var(--saffron);font-weight:600;}
.martyr-regt{font-size:11px;color:var(--muted);}
.martyr-act{font-size:12px;color:var(--text2);line-height:1.6;margin-top:5px;}

.award-card{background:var(--bg3);border-radius:12px;border:1px solid var(--border);padding:18px;display:flex;gap:14px;cursor:pointer;transition:all .2s;}
.award-card:hover{border-color:var(--warn)33;transform:translateY(-1px);}
.award-medal{font-size:32px;flex-shrink:0;position:relative;}
.posthumous-dot{position:absolute;bottom:-2px;right:-4px;background:var(--danger);color:#fff;font-size:8px;font-weight:900;width:14px;height:14px;border-radius:7px;display:flex;align-items:center;justify-content:center;}
.award-name{font-size:12px;font-weight:800;color:var(--warn);}
.award-recipient{font-size:15px;font-weight:700;color:var(--text);margin-top:2px;}
.award-details{font-size:11px;color:var(--muted);margin-top:2px;}
.award-citation{font-size:12px;color:var(--text2);line-height:1.6;margin-top:6px;font-style:italic;}

/* ===== QUOTE CARD ===== */
.quote-card{background:linear-gradient(135deg,#1a0800,#0a0a0f,#001400);border-radius:16px;border:1px solid var(--border);padding:28px;text-align:center;}
.quote-flag{font-size:40px;margin-bottom:16px;display:block;animation:sway 4s ease-in-out infinite;}
.quote-text{font-size:18px;color:var(--text);font-style:italic;line-height:1.7;margin-bottom:14px;}
.quote-by{font-size:13px;color:var(--saffron);font-weight:700;}

/* ===== SETTINGS LANG GRID ===== */
.lang-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
@media(max-width:700px){.lang-grid{grid-template-columns:repeat(2,1fr);}}
.lang-chip{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .2s;}
.lang-chip:hover,.lang-chip.active{border-color:var(--saffron);background:#1a0d00;}
.lang-chip-native{font-size:14px;font-weight:700;color:var(--text);}
.lang-chip-en{font-size:10px;color:var(--muted);margin-top:2px;}
.lang-chip-check{color:var(--saffron);font-size:12px;font-weight:900;margin-top:4px;}

/* ===== ANIMATIONS ===== */
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes enemyAdvance{0%{transform:translateX(0)}50%{transform:translateX(-40px)}100%{transform:translateX(0)}}
@keyframes fadeFlash{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes scanLine{0%{top:0}100%{top:100%}}
.pulse{animation:pulse 2s ease-in-out infinite;}
.enemy-advance{animation:enemyAdvance 2.5s ease-in-out infinite;}
.enemy-flash{animation:fadeFlash 0.8s ease-in-out infinite;}

/* ===== MISC ===== */
.divider{display:flex;height:2px;border-radius:1px;overflow:hidden;margin:16px 0;}
.divider .s{flex:1;}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);}
.empty-state-icon{font-size:48px;margin-bottom:12px;}
.tag{display:inline-block;background:var(--bg4);border:1px solid var(--border);border-radius:20px;padding:3px 10px;font-size:11px;color:var(--text2);margin:2px;}
.scan-overlay{position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(transparent,var(--success),transparent);opacity:.6;animation:scanLine 2s linear infinite;}
</style>
</head>
<body>
<div class="site-wrapper">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="tribar"><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div></div>
    <div class="sidebar-brand">
      <div class="flag">🇮🇳</div>
      <div class="brand-name">BHARAT RAKSHAK</div>
      <div class="brand-hindi">भारत रक्षक</div>
      <div class="brand-badge">🔒 MILITARY PORTAL</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Navigation</div>
      <a class="nav-item active" onclick="showScreen('home')" id="nav-home">
        <span class="nav-icon">🏠</span><span>Dashboard</span>
      </a>
      <a class="nav-item" onclick="showScreen('weapons')" id="nav-weapons">
        <span class="nav-icon">⚔️</span><span>Weapons & Supplies</span>
        <span class="nav-badge warn" id="alert-count" style="display:none">0</span>
      </a>
      <a class="nav-item" onclick="showScreen('battlefield')" id="nav-battlefield">
        <span class="nav-icon">🎯</span><span>Battlefield Helper</span>
      </a>
      <a class="nav-item" onclick="showScreen('heroes')" id="nav-heroes">
        <span class="nav-icon">🇮🇳</span><span>Heroes & History</span>
      </a>
      <div class="nav-section-label" style="margin-top:8px;">System</div>
      <a class="nav-item" onclick="showScreen('settings')" id="nav-settings">
        <span class="nav-icon">⚙️</span><span>Settings</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="tribar tribar-thin" style="margin-bottom:10px;"><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div></div>
      <div class="sidebar-footer-text">सेवा परमो धर्मः<br/><span style="color:var(--muted)">"Service Before Self"</span></div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="content-area">
    <!-- TOP BAR -->
    <div class="topbar">
      <button class="mobile-menu-btn" onclick="toggleSidebar()" id="menu-btn">☰</button>
      <div style="flex:1;">
        <div class="topbar-title" id="topbar-title">Dashboard</div>
        <div class="topbar-sub" id="topbar-sub">Indian Armed Forces Portal</div>
      </div>
      <div class="topbar-right">
        <div class="topbar-lang">
          🌐 <select id="lang-select" onchange="changeLang(this.value)">
            <option value="en">English</option>
            <option value="hi">हिन्दी</option>
            <option value="mr">मराठी</option>
            <option value="ta">தமிழ்</option>
            <option value="te">తెలుగు</option>
            <option value="pa">ਪੰਜਾਬੀ</option>
            <option value="bn">বাংলা</option>
            <option value="gu">ગુજરાતી</option>
            <option value="kn">ಕನ್ನಡ</option>
            <option value="ml">മലയാളം</option>
          </select>
        </div>
      </div>
    </div>
    <div class="tribar tribar-thin"><div class="s s1"></div><div class="s s2"></div><div class="s s3"></div></div>

    <!-- SCREENS (injected by JS) -->
    <div id="screen-container" style="padding:24px 28px 40px;">
      <div id="screen-home" class="screen active"></div>
      <div id="screen-weapons" class="screen"></div>
      <div id="screen-battlefield" class="screen"></div>
      <div id="screen-heroes" class="screen"></div>
      <div id="screen-settings" class="screen"></div>
    </div>
  </div>
</div>

<!-- MODALS (rendered by JS) -->
